# Builds standalone binaries on version tags (v*). Untested – adjust PyInstaller flags if needed.
name: Release
on:
  push: { tags: ["v*"] }
jobs:
  build:
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller
      - run: pyinstaller --noconfirm --windowed --name PrintBoard --add-data "printboard/icon.svg${{ runner.os == 'Windows' && ';' || ':' }}printboard" printboard/__main__.py
      - uses: actions/upload-artifact@v4
        with: { name: "PrintBoard-${{ matrix.os }}", path: dist/ }
